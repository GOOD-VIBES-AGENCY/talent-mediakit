name: Refresh Mediakit

on:
  schedule:
    # 毎週月曜 10:17 JST (= 01:17 UTC)。毎時0分は Actions の遅れやすい時刻なので避ける。
    - cron: '17 1 * * 1'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Refresh TikTok and YouTube counts
        id: followers
        continue-on-error: true
        run: python3 scripts/refresh_followers.py --write --skip-instagram

      - name: Commit verified count updates
        if: steps.followers.outcome == 'success' || steps.followers.outcome == 'failure'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html scripts/count_provenance.json scripts/follower_sources.json
          git add kanna/index.html mayu/index.html miu/index.html momoka/index.html nana/index.html oto/index.html ririka/index.html sae/index.html saki/index.html yui/index.html
          if git diff --cached --quiet; then
            echo "no count changes"
            exit 0
          fi
          git commit -m "fix: フォロワー数の公開ページ反映 $(date +'%Y-%m-%d')"

      - name: Push commits from this checkout
        run: git push origin "HEAD:${{ github.ref_name }}"

      - name: Fail if TikTok or YouTube was not retrieved
        if: steps.followers.outcome == 'failure'
        run: exit 1
