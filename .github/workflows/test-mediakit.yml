name: Test Mediakit

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch main for display-field comparison
        run: git fetch origin main

      - name: Run mediakit tests
        run: python3 -m unittest discover -s tests -v
